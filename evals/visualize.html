<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniHelp · Evaluation review</title>
<style>
  :root {
    color-scheme: light dark;
    --page: light-dark(#f4f7f6, #111a19);
    --surface: light-dark(#fff, #182422);
    --ink: light-dark(#192d2a, #e6f1ed);
    --muted: light-dark(#526763, #a7beb6);
    --line: light-dark(#d8e3df, #394e48);
    --accent: light-dark(#176651, #8edabd);
    --soft: light-dark(#e4f1ec, #263d35);
    --bad: light-dark(#a33030, #ffaaaa);
    font: 16px/1.5 system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); }
  a { color: var(--accent); text-underline-offset: .18em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap { width: min(100% - 2rem, 76rem); margin-inline: auto; }
  .mast { background: var(--surface); border-bottom: 1px solid var(--line); }
  .mast .wrap { display: flex; justify-content: space-between; gap: 1rem; padding-block: .8rem; }
  .brand { font-weight: 750; letter-spacing: -.02em; }
  .hero { padding-block: clamp(1.75rem, 5vw, 3.5rem) 1.5rem; }
  .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
  h1 { margin: .2rem 0 .5rem; font-size: clamp(2rem, 6vw, 3.65rem); line-height: 1.08; letter-spacing: -.05em; }
  h2 { font-size: 1.3rem; letter-spacing: -.025em; margin: 0 0 .65rem; }
  h3 { font-size: 1rem; margin: 0 0 .4rem; }
  p { margin: .3rem 0 .8rem; }
  .meta, .hint { color: var(--muted); }
  .hint { font-size: .86rem; }
  .stats, .overview, .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: .75rem; }
  .stat, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: .7rem; padding: 1rem 1.2rem; min-width: 0; }
  .stat strong { display: block; font-size: 1.75rem; line-height: 1.2; margin-top: .35rem; font-variant-numeric: tabular-nums; }
  .stat .hint { display: block; margin-top: .3rem; }
  .overview { margin: .9rem 0 1.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); }
  .section-heading { margin-top: 1.5rem; }
  .counts { margin: 0; }
  .counts div { display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--line); padding: .38rem 0; }
  .counts dt { font-size: .9rem; font-weight: 450; }
  .counts dd { font-variant-numeric: tabular-nums; font-weight: 700; }
  .outcome-panel { margin: .9rem 0 1.75rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .45rem .65rem .45rem 0; border-bottom: 1px solid var(--line); }
  td { white-space: nowrap; }
  .explorer { margin-bottom: 2.5rem; }
  .toolbar { display: flex; gap: .7rem; align-items: end; flex-wrap: wrap; margin: .8rem 0; }
  .toolbar label { display: grid; gap: .25rem; font-size: .85rem; font-weight: 650; }
  .toolbar label:first-child { flex: 1 1 16rem; }
  input, select { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: .35rem; min-height: 2.6rem; padding: .35rem .65rem; }
  .group { margin-top: 1.1rem; }
  .group h3 { color: var(--muted); }
  .case { background: var(--surface); border: 1px solid var(--line); border-radius: .5rem; margin-bottom: .45rem; }
  summary { cursor: pointer; overflow-wrap: anywhere; }
  .case > summary { padding: .7rem .95rem; }
  .case > summary strong { margin-left: .25rem; }
  .tags { display: inline-flex; flex-wrap: wrap; gap: .3rem; margin-left: .6rem; vertical-align: middle; }
  .tag { display: inline-block; background: var(--page); color: var(--muted); border-radius: .3rem; padding: .1rem .4rem; font-size: .8rem; font-weight: 650; }
  .tag.pass { background: var(--soft); color: var(--accent); }
  .tag.fail { color: var(--bad); }
  .case-body { padding: .7rem .95rem 1rem; border-top: 1px solid var(--line); }
  .detail { border-top: 1px solid var(--line); padding: .55rem 0; }
  .facts { margin: .6rem 0 1rem; }
  .facts div { min-width: 0; }
  dt { color: var(--muted); font-size: .8rem; font-weight: 650; }
  dd { margin: 0; overflow-wrap: anywhere; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: .8rem; background: var(--page); border-radius: .35rem; }
  blockquote { margin: .4rem 0 1rem; padding: .6rem .9rem; background: var(--page); border-left: 3px solid var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }
  .pass { color: var(--accent); }
  .fail { color: var(--bad); }
  [hidden] { display: none !important; }
  @media print {
    :root { color-scheme: light; }
    body { background: white; }
    .toolbar, .mast, noscript { display: none; }
    .hero { padding-top: .5rem; }
    .panel, .case { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="mast"><div class="wrap"><span class="brand">UniHelp</span><span class="meta">Evaluation review</span></div></div>
<main class="wrap">
<!-- REPORT -->
</main>
<script>
  const query = document.querySelector("#query");
  if (query) {
    const scope = document.querySelector("#scope");
    const groups = [...document.querySelectorAll(".group")].map(group => ({
      group,
      cases: [...group.querySelectorAll(".case")].map(entry => ({
        entry,
        text: entry.textContent.toLowerCase()
      }))
    }));
    const count = document.querySelector("#visible-count");
    const update = () => {
      const search = query.value.trim().toLowerCase();
      let visible = 0;
      for (const {group, cases} of groups) {
        let groupVisible = 0;
        for (const {entry, text} of cases) {
          entry.hidden = !text.includes(search) || (scope.value && group.dataset.scope !== scope.value);
          groupVisible += Number(!entry.hidden);
        }
        group.hidden = groupVisible === 0;
        visible += groupVisible;
      }
      count.textContent = visible ? `${visible} cases shown` : "No cases match your filters.";
    };
    query.addEventListener("input", update);
    scope.addEventListener("change", update);
    document.querySelector(".toolbar").hidden = false;
    update();
  }
</script>
</body>
</html>
